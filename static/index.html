<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Career Assistant</h1>
            <p>Powered by Groq Llama 3.3 70B</p>
        </header>

        <main>
            <!-- Form Section -->
            <section class="form-section">
                <h2>Get Started</h2>
                <form id="careerForm">
                    <div class="form-group">
                        <label for="resume">Resume (PDF)</label>
                        <input type="file" id="resume" accept=".pdf" required>
                        <span class="file-name" id="fileName"></span>
                    </div>

                    <div class="form-group">
                        <label for="targetRole">Target Role</label>
                        <input 
                            type="text" 
                            id="targetRole" 
                            placeholder="Software Engineer" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="githubUsername">GitHub Username</label>
                        <input 
                            type="text" 
                            id="githubUsername" 
                            placeholder="your-username" 
                            required
                        >
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="submitText">Analyze</span>
                        <span id="submitLoader" class="loader hidden"></span>
                    </button>
                </form>
            </section>

            <!-- Results Section -->
            <section id="results" class="results hidden">
                <div class="results-header">
                    <h2>Analysis</h2>
                    <button onclick="resetForm()" class="btn-reset">New Analysis</button>
                </div>
                
                <div class="result-card">
                    <h3>Job Search</h3>
                    <div id="jobSearchResult"></div>
                </div>

                <div class="result-card">
                    <h3>Skills</h3>
                    <div id="skillGapResult"></div>
                </div>

                <div class="result-card">
                    <h3>Projects</h3>
                    <div id="projectIdeasResult"></div>
                </div>

                <div class="result-card">
                    <h3>GitHub</h3>
                    <div id="githubReviewResult"></div>
                </div>
            </section>
        </main>

        <footer>
            <a href="https://github.com/Sathvik1533/career-assistant-agent">GitHub</a>
            <a href="/docs">API Docs</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
