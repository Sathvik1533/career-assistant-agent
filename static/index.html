<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assistant Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #0b0f19; 
            color: #f1f5f9; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
        }
        
        .container { 
            max-width: 1000px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
        }
        
        .header h1 { 
            font-size: 24px; 
            font-weight: 600; 
            color: #ffffff; 
            margin-bottom: 4px; 
        }
        
        .header p { 
            font-size: 14px; 
            color: #94a3b8; 
        }
        
        .form-grid { 
            background-color: #111827; 
            border: 1px solid #1f2937; 
            border-radius: 8px; 
            padding: 24px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 16px; 
            align-items: end; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .input-group label { 
            font-size: 13px; 
            font-weight: 500; 
            color: #94a3b8; 
        }
        
        .input-group input[type="text"], .file-btn { 
            background-color: #0b0f19; 
            border: 1px solid #374151; 
            border-radius: 6px; 
            padding: 10px 14px; 
            color: #ffffff; 
            font-size: 14px; 
            outline: none; 
            width: 100%; 
            transition: border-color 0.2s; 
        }
        
        .input-group input[type="text"]:focus { 
            border-color: #6366f1; 
        }
        
        .file-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-weight: 500; 
            background-color: #1f2937; 
            border-color: #374151; 
            text-align: center; 
        }
        
        .file-btn:hover { 
            background-color: #374151; 
        }
        
        .submit-btn { 
            background-color: #4f46e5; 
            color: #ffffff; 
            border: none; 
            border-radius: 6px; 
            padding: 11px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s; 
            width: 100%; 
        }
        
        .submit-btn:hover { 
            background-color: #4338ca; 
        }
        
        .console-box { 
            background-color: #030712; 
            border: 1px solid #1f2937; 
            border-radius: 6px; 
            padding: 16px; 
            font-family: monospace; 
            font-size: 13px; 
            color: #34d399; 
            max-height: 180px; 
            overflow-y: auto; 
            display: none; 
            line-height: 1.6; 
        }
        
        .results-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-top: 12px; 
        }
        
        .card { 
            background-color: #111827; 
            border: 1px solid #1f2937; 
            border-radius: 8px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            min-height: 200px; 
        }
        
        .card h3 { 
            font-size: 15px; 
            font-weight: 600; 
            color: #ffffff; 
            border-bottom: 1px solid #1f2937; 
            padding-bottom: 8px; 
        }
        
        .card-content { 
            font-size: 14px; 
            color: #cbd5e1; 
            line-height: 1.6; 
            overflow-y: auto; 
        }
        
        .card-content ul { 
            margin-left: 18px; 
        }
        
        .card-content p { 
            margin-bottom: 8px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Career Intelligence Engine</h1>
            <p>Automated pipeline analyzing portfolio metrics and skill alignments.</p>
        </div>
        
        <form id="analyze-form" class="form-grid">
            <div class="input-group">
                <label>Resume Payload</label>
                <label for="resume" class="file-btn" id="file-label">Choose PDF File</label>
                <input type="file" id="resume" accept=".pdf" style="display: none;" required />
            </div>
            
            <div class="input-group">
                <label>Target Core Role</label>
                <input type="text" id="target_role" placeholder="e.g. Backend Engineer" required />
            </div>
            
            <div class="input-group" style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: end;">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label>GitHub Identifier</label>
                    <input type="text" id="github_username" placeholder="e.g. Sathvik1533" required />
                </div>
                <button type="submit" class="submit-btn">Run</button>
            </div>
        </form>
        
        <div id="console-stream" class="console-box"></div>
        
        <div class="results-grid">
            <div class="card">
                <h3>🎯 Job Search Strategies</h3>
                <div id="res-job" class="card-content">Awaiting execution...</div>
            </div>
            
            <div class="card">
                <h3>📊 Skill Gap Analysis</h3>
                <div id="res-skills" class="card-content">Awaiting execution...</div>
            </div>
            
            <div class="card">
                <h3>💡 Portfolio Projects</h3>
                <div id="res-projects" class="card-content">Awaiting execution...</div>
            </div>
            
            <div class="card">
                <h3>🐙 GitHub Diagnostic</h3>
                <div id="res-github" class="card-content">Awaiting execution...</div>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
