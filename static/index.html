<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assistant</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Career Assistant</h1>
            <p>AI-powered career guidance and analysis</p>
        </header>

        <main>
            <!-- Form Section -->
            <section class="form-section">
                <h2>Get Started</h2>
                <form id="careerForm">
                    <div class="form-group">
                        <label for="resume">Resume (PDF)</label>
                        <input type="file" id="resume" accept=".pdf" required>
                        <span class="file-name" id="fileName">No file chosen</span>
                    </div>

                    <div class="form-group">
                        <label for="targetRole">Target Role</label>
                        <input 
                            type="text" 
                            id="targetRole" 
                            placeholder="Software Engineer" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="githubUsername">GitHub Username</label>
                        <input 
                            type="text" 
                            id="githubUsername" 
                            placeholder="your-username" 
                            required
                        >
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="submitText">Analyze</span>
                        <span id="submitLoader" class="loader hidden"></span>
                    </button>
                </form>
            </section>

            <!-- Live Agent Console Stream -->
            <div id="terminal-container" style="display: none; background-color: #1e1e1e; color: #34d399; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 6px; margin: 20px 0; box-shadow: inset 0 0 10px #000; border-left: 4px solid #10b981;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 10px; font-size: 12px; color: #94a3b8;">
                    <span>🤖 AGENT EXECUTION CONSOLE</span>
                    <span id="terminal-status">PROCESSING...</span>
                </div>
                <div id="terminal-logs" style="font-size: 14px; line-height: 1.6; max-height: 200px; overflow-y: auto;">
                    <!-- Streaming logs will be appended here dynamically -->
                </div>
            </div>

            <!-- Results Section -->
            <section id="results" class="results hidden">
                <div class="results-header">
                    <h2>Analysis Results</h2>
                    <button onclick="resetForm()" class="btn-reset">New Analysis</button>
                </div>
                
                <div class="result-card">
                    <h3>💼 Job Search Strategy</h3>
                    <div id="jobSearchResult" class="markdown-content"></div>
                </div>

                <div class="result-card">
                    <h3>📊 Skill Gap Analysis</h3>
                    <div id="skillGapResult" class="markdown-content"></div>
                </div>

                <div class="result-card">
                    <h3>💡 Project Ideas</h3>
                    <div id="projectIdeasResult" class="markdown-content"></div>
                </div>

                <div class="result-card">
                    <h3>�� GitHub Profile Review</h3>
                    <div id="githubReviewResult" class="markdown-content"></div>
                </div>
            </section>
        </main>

        <footer>
            <a href="https://github.com/Sathvik1533/career-assistant-agent">GitHub</a>
            <a href="/docs">API Docs</a>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
